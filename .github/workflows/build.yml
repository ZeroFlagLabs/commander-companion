name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify source hashes
        shell: cmd
        run: build.cmd -VerifyHashes
      - name: Build and run data tests
        shell: cmd
        run: build.cmd
      - name: Check the output is a single EXE
        shell: pwsh
        run: |
          $files = @(Get-ChildItem bin -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'CommanderCompanion.exe') { throw 'Unexpected runtime files.' }
